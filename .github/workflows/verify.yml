name: Verify

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install office render validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress-nogui libreoffice-writer-nogui
      - name: Install locked dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Build production container
        run: docker build --tag agent-diaz-verify:${{ github.sha }} .
      - name: Preserve exact-prompt regression artifact
        uses: actions/upload-artifact@v4
        with:
          name: french-present-tense-regression
          path: test-results/french-present-tense-regression.pptx
          if-no-files-found: error
          retention-days: 7
