name: Finalize Agent Diaz V2

on:
  push:
    branches:
      - variant/agent-diaz-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run Agent Díaz v2 finalization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: variant/agent-diaz-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply final V2 production patch
        run: python scripts/finalize_agent_v2.py
      - name: Typecheck
        run: npm run check
      - name: Run V2 contract tests
        run: npm test -- src/server/__tests__/agent-v2-runtime.test.ts
      - name: Run strict reviewed production audit
        run: npm run audit:reviewed
      - name: Commit final V2 runtime
        shell: bash
        run: |
          git config user.name "Agent Diaz V2 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .env.example \
            AGENT_DIAZ_V2_ARCHITECTURE.md \
            src/server/index.ts \
            src/server/openai-agent.ts \
            src/server/__tests__/agent-v2-runtime.test.ts \
            src/server/v2/artifact-agent-runtime.ts \
            src/server/v2/diagnostic-evidence.ts \
            src/server/v2/mcp-runtime.ts \
            src/server/v2/revision-ledger.ts \
            src/server/v2/runtime-readiness.ts \
            src/server/v2/sandbox-runtime.ts
          if git diff --cached --quiet; then
            echo "No finalization changes to commit"
            exit 0
          fi
          git commit -m "Finish Agent Díaz v2 production runtime"
          git push origin HEAD:variant/agent-diaz-v2
