name: Apply analysis provenance integration

on:
  push:
    branches:
      - codex/artifact-trust-rebuild

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[analysis-provenance]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/artifact-trust-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Apply provenance integration
        run: node scripts/apply-analysis-provenance.mjs
      - name: Remove one-shot migration
        run: |
          rm -f scripts/apply-analysis-provenance.mjs
          rm -f .github/workflows/apply-analysis-provenance.yml
      - name: Commit integration
        run: |
          git config user.name "Agent Diaz Trust Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prove analysis numbers from executed evidence [analysis-provenance]"
          git push origin HEAD:codex/artifact-trust-rebuild
