name: Temporary builder hardening test fix

on:
  push:
    branches:
      - codex/builder-visual-progress-hardening
    paths:
      - "scripts/temp-patch-visual-tests.mjs"
      - ".github/workflows/_temp_builder_hardening_fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/builder-visual-progress-hardening
      - name: Patch stale visual-budget tests
        run: node scripts/temp-patch-visual-tests.mjs
      - name: Commit patched tests
        run: |
          if git diff --quiet -- src/server/__tests__/agent.test.ts src/server/__tests__/artifact-golden.test.ts; then
            echo "No test patch needed"
            exit 0
          fi
          git config user.name "Idruiz"
          git config user.email "152026201+Idruiz@users.noreply.github.com"
          git add src/server/__tests__/agent.test.ts src/server/__tests__/artifact-golden.test.ts
          git commit -m "Align visual hardening regressions with image budgets"
          git push origin HEAD:codex/builder-visual-progress-hardening
