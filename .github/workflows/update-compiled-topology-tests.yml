name: Update compiled topology tests

on:
  push:
    branches:
      - codex/artifact-trust-rebuild

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[compiled-topology-tests]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/artifact-trust-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Update tests
        run: node scripts/update-compiled-topology-tests.mjs
      - name: Remove one-shot source and restore workflow file
        run: |
          rm -f scripts/update-compiled-topology-tests.mjs
          git checkout HEAD -- .github/workflows/update-compiled-topology-tests.yml
      - name: Commit updated tests
        run: |
          git config user.name "Agent Diaz Trust Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Assert compiled presentation topology [compiled-topology-tests]"
          git push origin HEAD:codex/artifact-trust-rebuild
