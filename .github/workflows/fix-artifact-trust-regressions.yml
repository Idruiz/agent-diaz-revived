name: Fix artifact trust regressions

on:
  push:
    branches:
      - codex/artifact-trust-rebuild

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[trust-regressions-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/artifact-trust-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Apply corrections
        run: node scripts/fix-artifact-trust-regressions.mjs
      - name: Remove one-shot source and restore workflow files
        run: |
          rm -f scripts/fix-artifact-trust-regressions.mjs
          git checkout HEAD -- .github/workflows/fix-artifact-trust-regressions.yml
      - name: Commit source repair
        run: |
          git config user.name "Agent Diaz Trust Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Correct trust rebuild regressions [trust-regressions-fixed]"
          git push origin HEAD:codex/artifact-trust-rebuild
