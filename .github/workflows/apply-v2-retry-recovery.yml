name: Apply Agent Diaz V2 Retry Recovery

on:
  push:
    branches:
      - variant/agent-diaz-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry V2 recovery patch after type fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: variant/agent-diaz-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply retry recovery patch
        run: |
          python scripts/finalize_v2_retry_recovery.py
          python scripts/fix_v2_retry_recovery_types.py
      - name: Typecheck
        run: npm run check
      - name: Run V2 contract tests
        run: npm test -- src/server/__tests__/agent-v2-runtime.test.ts
      - name: Run strict reviewed production audit
        run: npm run audit:reviewed
      - name: Commit retry recovery runtime
        shell: bash
        run: |
          git config user.name "Agent Diaz V2 Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add \
            AGENT_DIAZ_V2_ARCHITECTURE.md \
            src/server/openai-agent.ts \
            src/server/__tests__/agent-v2-runtime.test.ts \
            src/server/v2/artifact-agent-runtime.ts \
            src/server/v2/revision-ledger.ts
          if git diff --cached --quiet; then
            echo "No retry recovery changes to commit"
            exit 0
          fi
          git commit -m "Make Agent Díaz v2 infrastructure retries restart-safe"
          git push origin HEAD:variant/agent-diaz-v2
