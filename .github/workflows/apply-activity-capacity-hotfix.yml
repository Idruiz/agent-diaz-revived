name: Apply activity capacity hotfix

on:
  push:
    branches:
      - codex/activity-capacity-hotfix
    paths:
      - scripts/apply-activity-capacity-hotfix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/activity-capacity-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: node scripts/apply-activity-capacity-hotfix.mjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "Fix activity content capacity and log visibility"
          git push origin HEAD:codex/activity-capacity-hotfix
