name: Apply responsive visuals refactor

on:
  push:
    branches:
      - codex/responsive-visuals-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run responsive visuals refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/responsive-visuals-progress
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source refactor
        run: python scripts/apply-responsive-visuals-refactor.py
      - name: Commit source refactor
        run: |
          git config user.name "Idruiz"
          git config user.email "152026201+Idruiz@users.noreply.github.com"
          git add src/server/builders.ts src/server/openai-agent.ts
          git commit -m "Add responsive visuals and live artifact progress"
          git push origin codex/responsive-visuals-progress
