name: Harden artifact fidelity

on:
  push:
    branches:
      - codex/artifact-trust-rebuild

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[artifact-fidelity-hardened]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/artifact-trust-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Apply fidelity hardening
        run: node scripts/harden-artifact-fidelity-v2.mjs
      - name: Remove one-shot sources and restore workflow file
        run: |
          rm -f scripts/harden-artifact-fidelity.mjs scripts/harden-artifact-fidelity-v2.mjs
          git checkout HEAD -- .github/workflows/harden-artifact-fidelity.yml
      - name: Commit fidelity hardening
        run: |
          git config user.name "Agent Diaz Trust Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden artifact output fidelity and image coverage [artifact-fidelity-hardened]"
          git push origin HEAD:codex/artifact-trust-rebuild
