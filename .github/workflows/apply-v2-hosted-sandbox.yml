name: Apply Agent Diaz V2 Hosted Sandbox

on:
  push:
    branches:
      - variant/agent-diaz-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Agent Díaz v2 hosted sandbox integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: variant/agent-diaz-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install matching Agents SDK extensions
        run: npm install --save-exact @openai/agents-extensions@0.17.0
      - name: Apply sandbox integration
        run: python scripts/patch_v2_sandbox.py
      - name: Typecheck
        run: npm run check
      - name: Test V2 contracts
        run: npm test -- src/server/__tests__/agent-v2-runtime.test.ts
      - name: Run strict reviewed production audit
        run: npm run audit:reviewed
      - name: Commit hosted sandbox support
        shell: bash
        run: |
          git config user.name "Agent Diaz V2 Sandbox"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json src/server/v2/artifact-agent-runtime.ts src/server/__tests__/agent-v2-runtime.test.ts
          if git diff --cached --quiet; then
            echo "No sandbox changes to commit"
            exit 0
          fi
          git commit -m "Wire Agent Díaz v2 hosted sandbox runtime"
          git push origin HEAD:variant/agent-diaz-v2
