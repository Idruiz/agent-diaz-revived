name: Apply PPTX text extraction fix

on:
  push:
    branches:
      - codex/activity-capacity-hotfix
    paths:
      - scripts/apply-pptx-text-extraction-fix.mjs
      - .github/workflows/apply-pptx-text-extraction-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/activity-capacity-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch PPTX text extraction
        run: node scripts/apply-pptx-text-extraction-fix.mjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/artifact-quality.ts
          git diff --cached --quiet && exit 0
          git commit -m "Handle attributed PPTX text runs in fidelity checks"
          git push origin HEAD:codex/activity-capacity-hotfix
