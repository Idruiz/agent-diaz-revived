name: Apply structural validator refactor

"on":
  push:
    branches:
      - codex/structural-artifact-validation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run structural validator refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/structural-artifact-validation
          fetch-depth: 0
      - name: Apply source refactor
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "Idruiz"
          git config user.email "152026201+Idruiz@users.noreply.github.com"
          git add src/server/builders.ts src/server/artifact-quality.ts
          git commit -m "Validate rendered presentations by structural identity"
          git push origin HEAD:codex/structural-artifact-validation
