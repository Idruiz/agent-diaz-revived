name: Apply artifact trust rebuild

on:
  push:
    branches:
      - codex/artifact-trust-rebuild

permissions:
  contents: write

concurrency:
  group: artifact-trust-rebuild-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[trust-rebuild-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/artifact-trust-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Repair one-shot patch driver
        run: node scripts/fix-trust-driver.mjs
      - name: Apply deterministic source patch
        run: node scripts/apply-artifact-trust-rebuild.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/fix-trust-driver.mjs
          rm -f scripts/apply-artifact-trust-rebuild.mjs
          rm -f .github/workflows/apply-artifact-trust-rebuild.yml
      - name: Commit rebuilt artifact subsystem
        run: |
          git config user.name "Agent Diaz Trust Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild artifact trust pipeline [trust-rebuild-applied]"
          git push origin HEAD:codex/artifact-trust-rebuild
