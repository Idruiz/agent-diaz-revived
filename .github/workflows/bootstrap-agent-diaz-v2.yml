name: Bootstrap Agent Diaz V2

on:
  push:
    branches:
      - variant/agent-diaz-v2

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: variant/agent-diaz-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install OpenAI Agents SDK
        run: npm install --save-exact @openai/agents@0.17.0

      - name: Apply V2 integration patch
        run: python scripts/bootstrap_agent_v2.py

      - name: Typecheck V2
        run: npm run check

      - name: Test V2 contract
        run: npm test -- src/server/__tests__/agent-v2-runtime.test.ts

      - name: Commit V2 wiring and lockfile
        shell: bash
        run: |
          git config user.name "Agent Diaz V2 Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json src/server/config.ts src/server/openai-agent.ts src/server/v2/artifact-agent-runtime.ts
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "Wire Agent Díaz v2 agentic runtime"
          git push origin HEAD:variant/agent-diaz-v2
